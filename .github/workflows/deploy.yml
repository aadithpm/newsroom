name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build-plan-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform plan (PRs stop here)
        if: github.event_name == 'pull_request'
        working-directory: terraform
        run: terraform plan -no-color -input=false

      - name: Terraform apply (main only)
        if: github.event_name == 'push'
        working-directory: terraform
        run: terraform apply -auto-approve -no-color -input=false

      - name: Apply D1 migrations
        if: github.event_name == 'push'
        run: |
          DB_ID=$(cd terraform && terraform output -raw d1_database_id)
          DUMMY=00000000-0000-0000-0000-000000000000
          sed -i "s/$DUMMY/$DB_ID/" wrangler.toml
          npx wrangler d1 migrations apply newsroom --remote

      - name: Commit terraform state
        if: github.event_name == 'push'
        run: |
          git config user.name "newsroom-ci"
          git config user.email "ci@users.noreply.github.com"
          git add terraform/terraform.tfstate wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m "tfstate + d1 id after apply"
            git push
          fi
